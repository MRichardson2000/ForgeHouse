[project]
name = "forgehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgehouse"]
